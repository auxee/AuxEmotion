name: Create Release

on:
  push:
    tags-ignore:
      - test_*

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x.x'
      - name: Restore dependencies
        run: dotnet restore
      - name: Download Dalamud
        run: |
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/stg/latest.zip -OutFile latest.zip
          Expand-Archive -Force latest.zip "$env:AppData\XIVLauncher\addon\Hooks\dev"
      - name: Build
        run: |
          $ver = '${{ github.ref_name }}'
          invoke-expression 'dotnet build --no-restore --configuration Release --nologo -p:Version=$ver -p:FileVersion=$ver -p:AssemblyVersion=$ver'
      - name: Stage release package
        run: Copy-Item AuxEmotion/bin/x64/Release/AuxEmotion/latest.zip AuxEmotion.zip
      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v4
        with:
          path: AuxEmotion.zip
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: AuxEmotion ${{ github.ref_name }}
          files: AuxEmotion.zip
